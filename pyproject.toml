[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgddnet"
version = "1.0.0"
description = "CGDD-Net for retinal vessel segmentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10.0",
  "scikit-learn>=1.3", "PyYAML>=6.0", "tqdm>=4.66"
]

[tool.setuptools.packages.find]
include = ["cgddnet*"]
