[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgdd-net"
version = "0.1.0"
description = "CGDD-Net retinal vessel segmentation, built on the VesselSeg-Pytorch workflow"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=9.1", "scikit-learn>=1.2", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
profile = ["fvcore>=0.1.5"]

[tool.setuptools.packages.find]
include = ["cgddnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
