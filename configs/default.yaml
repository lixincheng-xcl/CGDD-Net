# CGDD-Net final paper configuration
# Dataset manifests are JSON files with: image, mask, optional fov, optional id.
dataset: DRIVE

model:
  in_channels: 3
  base_channels: 12
  detail_channels: 12
  dropout: 0.10
  ablation: full

train:
  seed: 2026
  deterministic: true
  patch_size: 48
  sampling_window: 64
  patches_per_epoch: 25600
  batch_size: 64
  workers: 8
  epochs: 50
  lr: 0.0005
  min_lr: 0.0000001
  betas: [0.9, 0.999]
  eps: 0.00000001
  weight_decay: 0.0
  early_stop_patience: 6
  grad_clip: 0.0

inference:
  patch_size: 96
  stride: 16
  threshold: 0.5

datasets:
  DRIVE:
    root: data/DRIVE
    train_manifest: splits/DRIVE/train.json
    val_manifest: splits/DRIVE/val.json
    test_manifest: splits/DRIVE/test.json
  CHASE_DB1:
    root: data/CHASE_DB1
    train_manifest: splits/CHASE_DB1/train.json
    val_manifest: splits/CHASE_DB1/val.json
    test_manifest: splits/CHASE_DB1/test.json
  STARE:
    root: data/STARE
    train_manifest: splits/STARE/train.json
    val_manifest: splits/STARE/val.json
    test_manifest: splits/STARE/test.json
  HRF:
    root: data/HRF
    train_manifest: splits/HRF/train.json
    val_manifest: splits/HRF/val.json
    test_manifest: splits/HRF/test.json
