name: PR controlled variant CPU profiling

on:
  push:
    branches:
      - experiments/pr-controlled-ablations-20261020
    paths:
      - experiments/profile_variants.py
      - .github/workflows/pr-variant-profile.yml
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,profile]'
      - run: >-
          python experiments/profile_variants.py
          --config configs/default.json --batch-size 1 --height 64 --width 64
          --device cpu --fvcore --output pr_variant_cpu_profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr-variant-cpu-profile
          path: |
            pr_variant_cpu_profile.json
            pr_variant_cpu_profile.csv